services:
  frontend:
    container_name: frontend
    hostname: frontend
    build:
      context: .
      target: dev
    #restart: always
    entrypoint: ["sh", "/app/docker/dev-entrypoint.sh"]
    command: ["yarn", "dev:docker"]
    env_file:
      - path: ./.env.local
        required: false
    environment:
      - NODE_ENV=development
      # Defaults for zero-config startup — override via .env.local
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-please-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - ENABLED_NEXTAUTH_PROVIDERS=${ENABLED_NEXTAUTH_PROVIDERS:-credentials}
      - ENABLE_SECURE_COOKIES=${ENABLE_SECURE_COOKIES:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - FEATURE_FLAG_PREFIX=${FEATURE_FLAG_PREFIX:-Feature_}
      - Feature_PALM_KB=${Feature_PALM_KB:-false}
      - Feature_DEEP_RESEARCH=${Feature_DEEP_RESEARCH:-false}
    networks:
      - palm-net
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - 3000:3000
      - 5555:5555
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  keycloak:
    container_name: keycloak
    hostname: keycloak
    image: quay.io/keycloak/keycloak:18.0.2
    env_file:
      - path: ./.env.local
        required: false
    environment:
      - NODE_ENV=development
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    networks:
      - palm-net
    command: --verbose start-dev
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - keycloak
  db:
    container_name: db
    hostname: db
    image: ankane/pgvector:v0.5.1 # The official docker image of pgvector, which adds the vector extension to postgres. This version is built on top of postgres:15 (see: https://hub.docker.com/r/ankane/pgvector)
    restart: always
    ports:
      - 5432:5432
    networks:
      - palm-net
    env_file:
      - path: ./.env.local
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  kb:
    hostname: kb
    build:
      context: ./docker/kb
    env_file:
      - path: ./.env.local
        required: false
    networks:
      - palm-net
    ports:
      - 5000:5000
    profiles:
      - kb
  redis:
    container_name: redis
    hostname: redis
    image: redis:latest
    networks:
      - palm-net
    ports:
      - "6379:6379"

networks:
  palm-net:

volumes:
  db-data:
